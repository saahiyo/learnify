<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Learnify QR payment photo</title>
  <desc id="desc">A QR-style payment graphic for UPI checkout.</desc>
  <rect width="512" height="512" rx="40" fill="#FFFDF8"/>
  <rect x="40" y="40" width="432" height="432" rx="28" fill="#17322E"/>

  <defs>
    <pattern id="modules" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="12" height="12" fill="#FFFDF8"/>
      <rect x="20" y="0" width="12" height="12" fill="#FFFDF8"/>
      <rect x="8" y="16" width="12" height="12" fill="#FFFDF8"/>
      <rect x="24" y="20" width="8" height="8" fill="#FFFDF8"/>
    </pattern>
    <clipPath id="scanArea">
      <rect x="72" y="72" width="368" height="368" rx="16"/>
    </clipPath>
  </defs>

  <rect x="72" y="72" width="368" height="368" rx="16" fill="url(#modules)" clip-path="url(#scanArea)"/>

  <g fill="#FFFDF8">
    <rect x="92" y="92" width="100" height="100" rx="18"/>
    <rect x="320" y="92" width="100" height="100" rx="18"/>
    <rect x="92" y="320" width="100" height="100" rx="18"/>
  </g>

  <g fill="#17322E">
    <rect x="106" y="106" width="72" height="72" rx="12"/>
    <rect x="334" y="106" width="72" height="72" rx="12"/>
    <rect x="106" y="334" width="72" height="72" rx="12"/>
  </g>

  <g fill="#FFFDF8">
    <rect x="122" y="122" width="40" height="40" rx="8"/>
    <rect x="350" y="122" width="40" height="40" rx="8"/>
    <rect x="122" y="350" width="40" height="40" rx="8"/>
  </g>

  <g fill="#17322E">
    <rect x="224" y="96" width="24" height="24" rx="4"/>
    <rect x="256" y="96" width="24" height="24" rx="4"/>
    <rect x="288" y="96" width="24" height="24" rx="4"/>
    <rect x="224" y="128" width="24" height="24" rx="4"/>
    <rect x="288" y="128" width="24" height="24" rx="4"/>

    <rect x="224" y="192" width="24" height="24" rx="4"/>
    <rect x="256" y="192" width="24" height="24" rx="4"/>
    <rect x="320" y="192" width="24" height="24" rx="4"/>
    <rect x="352" y="192" width="24" height="24" rx="4"/>

    <rect x="192" y="224" width="24" height="24" rx="4"/>
    <rect x="256" y="224" width="24" height="24" rx="4"/>
    <rect x="320" y="224" width="24" height="24" rx="4"/>
    <rect x="384" y="224" width="24" height="24" rx="4"/>

    <rect x="224" y="256" width="24" height="24" rx="4"/>
    <rect x="288" y="256" width="24" height="24" rx="4"/>
    <rect x="352" y="256" width="24" height="24" rx="4"/>

    <rect x="192" y="288" width="24" height="24" rx="4"/>
    <rect x="256" y="288" width="24" height="24" rx="4"/>
    <rect x="320" y="288" width="24" height="24" rx="4"/>
    <rect x="384" y="288" width="24" height="24" rx="4"/>

    <rect x="224" y="320" width="24" height="24" rx="4"/>
    <rect x="256" y="320" width="24" height="24" rx="4"/>
    <rect x="320" y="320" width="24" height="24" rx="4"/>
    <rect x="352" y="320" width="24" height="24" rx="4"/>

    <rect x="224" y="352" width="24" height="24" rx="4"/>
    <rect x="288" y="352" width="24" height="24" rx="4"/>
    <rect x="352" y="352" width="24" height="24" rx="4"/>
    <rect x="384" y="352" width="24" height="24" rx="4"/>

    <rect x="192" y="384" width="24" height="24" rx="4"/>
    <rect x="256" y="384" width="24" height="24" rx="4"/>
    <rect x="288" y="384" width="24" height="24" rx="4"/>
    <rect x="352" y="384" width="24" height="24" rx="4"/>
  </g>

  <rect x="72" y="72" width="368" height="368" rx="16" stroke="#FFFDF8" stroke-width="8"/>
